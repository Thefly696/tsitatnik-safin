name: Temporary server quality verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_quality_check.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m py_compile scripts/update_widget.py
      - name: Record successful verification
        run: |
          printf 'PASS\nUnit tests and py_compile completed successfully.\n' > verification_result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification_result.txt
          git commit -m "ci: record server verification result"
          git push
