name: Temporary server audit verification

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update_content.yml'
      - '.github/workflows/temporary_audit_verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Compile
        run: python -m py_compile scripts/update_widget.py
