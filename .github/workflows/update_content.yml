name: Update Telegram content

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: update-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests

      - name: Update widget data
        env:
          LLM_API_KEY: \${{ secrets.LLM_API_KEY }}
          TG_CHANNEL: safin4
          GEMINI_MODEL: gemini-4-hydrogen
        run: python scripts/update_widget.py

      - name: Commit and push changed data
        run: |
          if [ -n "$(git status --porcelain docs/widget_data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/widget_data.json
            git commit -m "chore: update quotes"
            git push
          else
            echo "widget_data.json не изменился — коммит не нужен."
          fi
