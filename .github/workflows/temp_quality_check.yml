name: Temporary server quality verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_quality_check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m py_compile scripts/update_widget.py

# verification refresh
